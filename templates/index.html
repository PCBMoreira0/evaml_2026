<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EVA — console de execução</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --panel:#dfe5ea; --ink:#16202b; --ink-soft:#5b6b7a;
    --signal:#b4610f; --live:#1f7a4d; --line:#a9b6c0;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--panel); color:var(--ink);
       font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:14px; line-height:1.5}
  .wrap{max-width:1240px; margin:0 auto; padding:22px 20px 40px}
  h1{font-family:"Space Grotesk",sans-serif; font-weight:700; font-size:24px; letter-spacing:-.02em; margin:0 0 16px}
  .label{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-soft)}

  .layout{display:grid; grid-template-columns:400px 1fr; gap:18px; align-items:start}
  @media (max-width:840px){ .layout{grid-template-columns:1fr} }

  .track{border:1px solid var(--line); background:#eef2f5; border-radius:3px;
         padding:6px 0 14px; margin-bottom:16px}
  .slot{padding:9px 18px; border-left:4px solid transparent}
  .slot-label{font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-soft);
              height:15px; white-space:nowrap; overflow:hidden}
  .slot-label .hint{letter-spacing:0; text-transform:none; font-size:11px; opacity:.8; margin-left:6px}
  /* Alturas fixas: o conteúdo varia de tamanho, mas as linhas não mudam de altura,
     então os botões abaixo nunca se deslocam. */
  .slot-node{font-family:"Space Grotesk",sans-serif; font-weight:500; font-size:17px;
             color:var(--ink-soft); margin-top:1px; height:24px; line-height:24px;
             white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .slot-text{font-size:12px; color:var(--ink-soft); height:18px; line-height:18px;
             white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .slot.current{border-left-color:var(--live); background:#e8f0eb}
  .slot.current .slot-node{font-weight:700; font-size:24px; height:31px; line-height:31px; color:var(--ink)}
  .slot.next{border-left-color:var(--signal)}
  .slot.next .slot-node{font-weight:700; font-size:24px; height:31px; line-height:31px; color:var(--ink)}
  .slot.empty .slot-node{opacity:.45}
  .meta{display:flex; gap:18px; flex-wrap:wrap; margin:10px 18px 0; padding-top:10px;
        border-top:1px dashed var(--line); font-size:12px}
  .dot{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--ink-soft); margin-right:6px; vertical-align:1px}
  .dot.play{background:var(--live); box-shadow:0 0 0 3px rgba(31,122,77,.18)}

  fieldset{border:1px solid var(--line); border-radius:3px; padding:14px 16px; margin:0 0 16px; background:#eef2f5}
  legend{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-soft); padding:0 6px}
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
  select,input[type=text]{font:inherit; padding:8px 10px; border:1px solid var(--line);
       border-radius:3px; background:#fff; color:var(--ink); min-width:0}
  button{font-family:"Space Grotesk",sans-serif; font-weight:500; font-size:14px; padding:9px 16px;
       border:1px solid var(--ink); border-radius:3px; background:#fff; color:var(--ink); cursor:pointer}
  button:hover:not(:disabled){background:var(--ink); color:#eef2f5}
  button:disabled{opacity:.35; cursor:not-allowed}
  button.primary{background:var(--ink); color:#eef2f5}
  button.on{background:var(--live); border-color:var(--live); color:#fff}
  :focus-visible{outline:2px solid var(--signal); outline-offset:2px}

  #inputBox{border-color:var(--signal); background:#f7ece2}
  #inputBox[hidden]{display:none}
  #inputBox legend{color:var(--signal)}

  .err{border:1px solid var(--signal); background:#f7ece2; color:#7d420a; padding:10px 14px;
       border-radius:3px; margin-bottom:16px; font-size:13px}
  .err[hidden]{display:none}

  .logcol{position:sticky; top:20px}
  .logbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px}
  #log{background:#101a24; color:#d6e0e8; border-radius:3px; padding:16px 18px;
       height:calc(100vh - 90px); overflow:auto; white-space:pre-wrap; word-break:break-word;
       font-size:12.5px; line-height:1.55}
</style>
</head>
<body>
<div class="wrap">

  <h1>EVA · console de execução</h1>

  <div class="layout">
    <div>
      <div class="track">
        <div class="slot" id="slotPrev">
          <div class="slot-label">anterior</div>
          <div class="slot-node" id="prevNode">—</div>
          <div class="slot-text" id="prevText"></div>
        </div>
        <div class="slot current" id="slotCurr">
          <div class="slot-label">atual <span class="hint">↻ Repetir executa este</span></div>
          <div class="slot-node" id="currNode">—</div>
          <div class="slot-text" id="currText"></div>
        </div>
        <div class="slot next" id="slotNext">
          <div class="slot-label">próximo <span class="hint">▸ Avançar executa este</span></div>
          <div class="slot-node" id="nextNode">—</div>
          <div class="slot-text" id="nextText"></div>
        </div>
        <div class="meta">
          <div><span class="dot" id="dot"></span><b id="state">NO_SCRIPT</b></div>
          <div>histórico <b id="hist">0</b></div>
        </div>
      </div>

      <fieldset>
        <legend>script</legend>
        <div class="row">
          <select id="scripts" style="flex:1"></select>
          <button id="load">Carregar</button>
        </div>
        <div class="row" style="margin-top:10px">
          <select id="mode">
            <option>terminal</option><option>robot</option>
          </select>
          <button id="start" class="primary">Iniciar</button>
        </div>
      </fieldset>

      <fieldset>
        <legend>execução</legend>
        <div class="row">
          <button id="step" class="primary">Avançar ▸</button>
          <button id="repeat">Repetir ↻</button>
          <button id="back">Voltar ◂</button>
        </div>
        <div class="row" style="margin-top:10px">
          <button id="auto">Modo automático</button>
          <label style="font-size:12px; color:var(--ink-soft)">
            intervalo <input type="text" id="delay" value="1.0" style="width:56px; text-align:center"> s
          </label>
        </div>
        <div class="row" style="margin-top:10px">
          <button id="reset">Voltar ao início</button>
        </div>
      </fieldset>

      <fieldset id="inputBox" hidden>
        <legend id="inputLegend">entrada</legend>
        <div class="row">
          <input type="text" id="answer" placeholder="Valor" autocomplete="off" style="flex:1">
          <button id="send" class="primary">Enviar</button>
        </div>
      </fieldset>

      <div class="err" id="err" hidden></div>
    </div>

    <div class="logcol">
      <div class="logbar">
        <span class="label">saída do player</span>
        <button id="clear" style="padding:4px 10px; font-size:12px">Limpar tela</button>
      </div>
      <div id="log"></div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let auto = false, waiting = false;
let upcomingTag = null, currentTag = null;

async function call(url, body){
  const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'},
                              body: JSON.stringify(body || {})});
  return r.json();
}

function fillSlot(slotId, nodeId, textId, n){
  const text = n ? (n.id ? 'id: ' + n.id + '   ' : '') + (n.text || '') : '';
  $(nodeId).textContent = n ? '<' + n.tag + '>' : '—';
  $(textId).textContent = text;
  $(textId).title = text;          // o texto é truncado; o completo aparece no hover
  $(slotId).classList.toggle('empty', !n);
}

function render(s){
  if (s.log && s.log.length){
    $('log').textContent += s.log.join('\n') + '\n';
    $('log').scrollTop = $('log').scrollHeight;
  }
  $('state').textContent = s.state;
  $('hist').textContent = s.history;
  $('dot').className = 'dot' + (s.state === 'PLAY' ? ' play' : '');

  fillSlot('slotPrev', 'prevNode', 'prevText', s.previous);
  fillSlot('slotCurr', 'currNode', 'currText', s.current);
  fillSlot('slotNext', 'nextNode', 'nextText', s.upcoming);

  $('err').hidden = !s.error;
  $('err').textContent = s.error || '';

  upcomingTag = s.upcoming ? s.upcoming.tag : null;
  currentTag = s.current ? s.current.tag : null;

  const playing = s.state === 'PLAY';
  $('step').disabled = $('reset').disabled = !playing || waiting;
  $('repeat').disabled = !s.current || waiting;   // repete o "atual"
  $('back').disabled = !s.current || waiting;     // desfaz o "atual"
  $('auto').disabled = !playing;
  $('start').disabled = s.state !== 'IDLE';
}

// Comandos que, no modo terminal, pedem um valor digitado pelo usuário.
const INPUT_TAGS = {
  listen:      {legend: '🎤 o robô está ouvindo',    placeholder: 'Resposta do usuário'},
  qrRead:      {legend: '🔳 leitura de QR code',      placeholder: 'Conteúdo do QR code'},
  userEmotion: {legend: '🙂 emoção do usuário',       placeholder: 'Emoção detectada'},
};

function enterWaiting(tag){
  waiting = true;
  const cfg = INPUT_TAGS[tag];
  $('inputLegend').textContent = cfg.legend;
  $('answer').placeholder = cfg.placeholder;
  $('inputBox').hidden = false;
  $('answer').focus();
  $('step').disabled = $('repeat').disabled = $('back').disabled = $('reset').disabled = true;
}
function exitWaiting(){
  waiting = false;
  $('inputBox').hidden = true;
}

async function doStep(){
  const tag = upcomingTag;
  if (INPUT_TAGS[tag]) enterWaiting(tag);
  const s = await call('/api/step');
  if (INPUT_TAGS[tag]) exitWaiting();
  render(s);
  return s;
}

async function doRepeat(){
  const tag = currentTag;
  if (INPUT_TAGS[tag]) enterWaiting(tag);
  const s = await call('/api/repeat');
  if (INPUT_TAGS[tag]) exitWaiting();
  render(s);
}

$('load').onclick = () => call('/api/load', {script_file: $('scripts').value}).then(render);
$('start').onclick = () => call('/api/start', {mode: $('mode').value}).then(render);
$('step').onclick = doStep;
$('repeat').onclick = doRepeat;
$('back').onclick = () => call('/api/back').then(render);
$('reset').onclick = () => call('/api/reset').then(render);
$('clear').onclick = () => { $('log').textContent = ''; };

fetch('/api/scripts').then(r => r.json()).then(({scripts}) => {
  $('scripts').innerHTML = scripts.length
    ? scripts.map(f => '<option>' + f + '</option>').join('')
    : '<option value="">nenhum .xml em eva_scripts/</option>';
});

$('auto').onclick = async () => {
  auto = !auto;
  $('auto').classList.toggle('on', auto);
  $('auto').textContent = auto ? 'Pausar automático' : 'Modo automático';
  while (auto){
    const s = await doStep();
    if (s.state !== 'PLAY' || s.error) { auto = false; break; }
    // Se o próximo passo pedir entrada do usuário, paramos o automático.
    if (INPUT_TAGS[upcomingTag]) { auto = false; break; }
    await new Promise(r => setTimeout(r, (parseFloat($('delay').value) || 0) * 1000));
  }
  $('auto').classList.remove('on');
  $('auto').textContent = 'Modo automático';
};

function send(){ call('/api/input', {text: $('answer').value}); $('answer').value = ''; }
$('send').onclick = send;
$('answer').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
</script>
</body>
</html>
